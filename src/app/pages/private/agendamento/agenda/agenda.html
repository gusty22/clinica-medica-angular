<div class="container-fluid p-0">

  <div class="d-flex flex-column flex-md-row align-items-md-center justify-content-md-between mb-4">
    <div>
        <h1 class="h3 fw-bold text-dark mb-1">Agenda Médica</h1>
        <p class="text-secondary mb-0">Visualize e gerencie suas consultas</p>
    </div>
    <div class="mt-3 mt-md-0 d-flex gap-2">
        <button class="btn btn-primary d-inline-flex align-items-center gap-2" (click)="handleDateClick(null)">
            <i data-feather="plus" style="width: 1em; height: 1em;"></i> Nova Consulta
        </button>
    </div>
  </div>

  <div class="card shadow-sm border-0 rounded-4 mb-4">
    <div class="card-body p-3 d-flex align-items-center gap-3">
        <label class="form-label small mb-0 fw-medium text-dark">Filtrar por Profissional:</label>
        <select class="form-select form-select-sm" style="width: auto;" [(ngModel)]="medicoFiltro" (change)="aplicarFiltroMedico()">
            <option value="todos">Todos os Profissionais</option>
            <option *ngFor="let m of medicos" [value]="m.nome">{{ m.nome }}</option>
        </select>
    </div>
  </div>

  <div class="row g-4 mb-4">
    <div class="col-lg-12">
        <div class="card shadow-sm border-0 rounded-4 h-100">
            <div class="card-body p-4">
                <full-calendar #calendar [options]="calendarOptions"></full-calendar>
            </div>
        </div>
    </div>
  </div>

</div>

<div class="modal fade" id="consultaModal" tabindex="-1" aria-labelledby="consultaModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-lg modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content rounded-4 border-0 shadow-lg">
            <div class="modal-header border-bottom p-4">
                <h1 class="modal-title fs-5 fw-bold text-dark" id="consultaModalLabel">Nova Consulta</h1>
                <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            
            <div class="modal-body p-4">
                <form (ngSubmit)="salvarConsulta()" id="consultaForm">

                    <h5 class="h6 fw-medium text-dark mb-3">Dados do Paciente</h5>
                    <div class="row g-3 mb-3">
                        <div class="col-md-8 position-relative">
                            <label class="form-label small">Paciente (Nome ou CPF)</label>
                            <input type="text" class="form-control form-control-sm" 
                                   placeholder="Digite para buscar..." 
                                   [(ngModel)]="eventoEmEdicao.paciente" 
                                   (input)="filtrarPacientes($event)" 
                                   name="paciente" autocomplete="off" required>
                            
                            <div class="list-group autocomplete-list" *ngIf="sugestoesPacientes.length > 0">
                                <a href="javascript:void(0)" class="list-group-item list-group-item-action small"
                                   *ngFor="let p of sugestoesPacientes"
                                   (click)="selecionarPaciente(p)">
                                   {{ p.nome }} <span class="text-muted">({{ p.cpf }})</span>
                                </a>
                            </div>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small">Contato</label>
                            <input type="text" class="form-control form-control-sm" [(ngModel)]="eventoEmEdicao.contato" name="contato" readonly>
                        </div>
                    </div>

                    <hr class="my-4">
                    <h5 class="h6 fw-medium text-dark mb-3">Dados da Consulta</h5>
                    <div class="row g-3 mb-3">
                        <div class="col-md-5">
                            <label class="form-label small">Especialidade</label>
                            <select class="form-select form-select-sm" [(ngModel)]="eventoEmEdicao.especialidade" (change)="filtrarMedicosPorEspecialidade()" name="especialidade">
                                <option value="todas">Todas as especialidades</option>
                                <option *ngFor="let esp of listaEspecialidades" [value]="esp">{{ esp }}</option>
                            </select>
                        </div>
                        <div class="col-md-7">
                            <label class="form-label small">Médico</label>
                            <select class="form-select form-select-sm" [(ngModel)]="eventoEmEdicao.medico" name="medico" [disabled]="medicosFiltradosNoForm.length === 0" required>
                                <option value="" disabled selected>Selecione...</option>
                                <option *ngFor="let m of medicosFiltradosNoForm" [value]="m.nome">{{ m.nome }}</option>
                            </select>
                        </div>
                        
                        <div class="col-md-4">
                            <label class="form-label small">Data</label>
                            <input type="date" class="form-control form-control-sm" [(ngModel)]="eventoEmEdicao.data" name="data" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small">Hora</label>
                            <input type="time" class="form-control form-control-sm" [(ngModel)]="eventoEmEdicao.hora" name="hora" required>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small">Tipo</label>
                            <select class="form-select form-select-sm" [(ngModel)]="eventoEmEdicao.tipo" name="tipo">
                                <option value="Primeira vez">Primeira vez</option>
                                <option value="Retorno">Retorno</option>
                                <option value="Exame">Exame</option>
                            </select>
                        </div>
                        <div class="col-md-4">
                            <label class="form-label small">Status</label>
                            <select class="form-select form-select-sm" [(ngModel)]="eventoEmEdicao.status" name="status">
                                <option value="Ativa">Ativa</option>
                                <option value="Concluída">Concluída</option>
                                <option value="Cancelada">Cancelada</option>
                            </select>
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label small">Sintomas</label>
                        <textarea class="form-control form-control-sm" rows="2" [(ngModel)]="eventoEmEdicao.sintomas" name="sintomas"></textarea>
                    </div>

                </form>
            </div>

            <div class="modal-footer bg-light border-top p-3 d-flex justify-content-between">
                <div>
                    <button *ngIf="eventoEmEdicao.id" type="button" class="btn btn-sm btn-outline-danger" (click)="excluirConsulta()">
                        <i data-feather="trash-2" style="width:14px"></i> Excluir
                    </button>
                </div>
                <div class="d-flex gap-2">
                    <button type="button" class="btn btn-sm btn-outline-secondary" data-bs-dismiss="modal">Cancelar</button>
                    <button type="submit" form="consultaForm" class="btn btn-sm btn-primary">Salvar</button>
                </div>
            </div>
        </div>
    </div>
</div>
